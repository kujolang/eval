name: compatibility-matrix

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday
  workflow_dispatch:

jobs:
  matrix-test:
    strategy:
      matrix:
        kujo-ref:
          - "357796a1a868f2c80bc8f7b8edcc7d6aff384f04"  # Current pinned
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Kujo runtime (${{ matrix.kujo-ref }})
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/kujo-runtime
          git -C /tmp/kujo-runtime remote add origin https://github.com/kujolang/kujo.git
          git -C /tmp/kujo-runtime fetch --depth 1 origin "${{ matrix.kujo-ref }}"
          git -C /tmp/kujo-runtime checkout --detach "${{ matrix.kujo-ref }}"
          cargo build --release --locked --manifest-path /tmp/kujo-runtime/Cargo.toml
          echo "/tmp/kujo-runtime/target/release" >> "$GITHUB_PATH"

      - name: Verify Kujo runtime
        run: kujo --version

      - name: Run contract tests
        run: kujo test

      - name: Run eval CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          kujo run main.kujo version
          kujo run main.kujo list-checks
          kujo run main.kujo run examples/release_gate_suite.json --json
